# ScummVM configuration for the lunatix guest.
#
# ntsc=false is the important line. With NTSC filtering on -- the default -- the ADL engine builds
# its colour table with sin/cos/floor in double precision, and this machine has neither floating
# point nor a multiplier: a profile of the startup shows all of its time in __ieee754_rem_pio2,
# floor and __adddf3, called from PixelWriterColorNTSC's constructor. PixelWriterColor gives the
# same 16 Apple II colours with integer arithmetic only.
#
# This is the same configuration with NO AUDIO DEVICE, for a game that has no sound to play. It
# exists for Mystery House: in ScummVM's ADL engine the Apple II speaker synth is only wired up by
# hires5.cpp (Time Zone), and hires1.cpp has no sound code at all, matching the silent 1980
# original. mute=true is NOT enough -- it only sets the volumes to zero, while ScummVM still opens
# /dev/dsp and its mixer thread still mixes 44100 Hz stereo silence and writes ~176 KB every
# second, all of it interpreted one subleq at a time.
#
# Measured, mystery to the point where the game switches to 640x400: 38 s instead of 56-63 s,
# 95k syscall traps instead of ~199k, and the share of the machine spent in userspace 33.7%
# instead of 16%. `mystery --sound` uses scummvm.ini instead and gets the device back.
[scummvm]
disable_sdl_audio=true
speech_mute=true
mute=true
gui_theme=scummclassic
scale_factor=1
aspect_ratio=false
filtering=false
ntsc=false
color=true
monotext=true
scanlines=false

[hires1]
engineid=adl
gameid=hires1
description=Hi-Res Adventure #1: Mystery House
path=/games/mysthouse
platform=apple2
language=en
ntsc=false
color=true
monotext=true

[hires5]
engineid=adl
gameid=hires5
description=Hi-Res Adventure #5: Time Zone
path=/games/timezone
platform=apple2
language=en
ntsc=false
color=true
monotext=true
