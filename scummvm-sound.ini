# ScummVM configuration for the lunatix guest -- WITH the audio device (mystery --sound).
#
# ntsc=false is the important line. With NTSC filtering on -- the default -- the ADL engine builds
# its colour table with sin/cos/floor in double precision, and this machine has neither floating
# point nor a multiplier: a profile of the startup shows all of its time in __ieee754_rem_pio2,
# floor and __adddf3, called from PixelWriterColorNTSC's constructor. PixelWriterColor gives the
# same 16 Apple II colours with integer arithmetic only.
#
# disable_sdl_audio=true is the second thing worth knowing. mute=true only sets the volumes to
# zero: ScummVM still opens /dev/dsp and its mixer thread still mixes 44100 Hz stereo silence and
# writes it to the card, about 176 KB every second, all of it interpreted one subleq at a time.
# Mystery House cannot make a sound in the first place -- in ScummVM's ADL engine the Apple II
# speaker synth is only wired up by hires5.cpp (Time Zone), and hires1.cpp has no sound code at
# all, matching the silent 1980 original -- so that work buys exactly nothing. Run `mystery
# --sound` to get the device back (scummvm-sound.ini), which is what a game with sound wants.
[scummvm]
gui_theme=scummclassic
scale_factor=1
aspect_ratio=false
filtering=false
ntsc=false
color=true
monotext=true
scanlines=false
speech_mute=false
mute=false

[hires1]
engineid=adl
gameid=hires1
description=Hi-Res Adventure #1: Mystery House
path=/games/mysthouse
platform=apple2
language=en
ntsc=false
color=true
monotext=true
