# ScummVM configuration for the lunatix guest.
#
# ntsc=false is the important line. With NTSC filtering on -- the default -- the ADL engine builds
# its colour table with sin/cos/floor in double precision, and this machine has neither floating
# point nor a multiplier: a profile of the startup shows all of its time in __ieee754_rem_pio2,
# floor and __adddf3, called from PixelWriterColorNTSC's constructor. PixelWriterColor gives the
# same 16 Apple II colours with integer arithmetic only.
#
# Sound is ON here. This is the configuration a plain `scummvm` uses, so it describes the emulator
# rather than any one game: engines that have sound should have it. The cost is real on this machine
# -- the mixer feeds 44100 Hz stereo to /dev/dsp and every sample is interpreted one subleq at a
# time -- so a game with NO sound at all should opt out instead; see scummvm-silent.ini and the
# `mystery` launcher, which uses it.
#
# output_rate=11025 matches the guest's sound card. ScummVM defaults to 44100, which means the mixer
# generates FOUR samples for every one the card takes -- 176 KB/s of mixing where 44 KB/s would do,
# every sample of it interpreted one subleq at a time, whether anything is playing or not.
[scummvm]
output_rate=11025
speech_mute=false
mute=false
gui_theme=scummclassic
scale_factor=1
aspect_ratio=false
filtering=false
ntsc=false
color=true
monotext=true
scanlines=false

[hires1]
engineid=adl
gameid=hires1
description=Hi-Res Adventure #1: Mystery House
path=/games/mysthouse
platform=apple2
language=en
ntsc=false
color=true
monotext=true

